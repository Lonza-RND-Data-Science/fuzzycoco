name: unit tests

on:
  push:
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: 
          - windows-2022
          # - ubuntu-latest
          # - macos
        compiler:
          - gcc
    steps:
    - uses: actions/checkout@v4
    
    - name: Cache
      uses: actions/cache@v3
      with:
        path: |
          ./build/
          ~/vcpkg
          ~/.cache/vcpkg/archives
          ${{ env.LOCALAPPDATA }}/vcpkg/archives
          ${{ env.APPDATA }}/vcpkg/archives
          ${{ env.XDG_CACHE_HOME }}/vcpkg/archives
          ~/.cache/ccache
          ~/.ccache
          ~/.config/ccache
          ~/Library/Caches/ccache
          ${{ env.LOCALAPPDATA }}/ccache
          ${{ env.XDG_CACHE_HOME }}/ccache
        key: ${{ runner.os }}-${{ matrix.compiler }}-${{ env.BUILD_TYPE }}-${{ hashFiles('**/CMakeLists.txt', './vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-${{ env.BUILD_TYPE }}-


    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: ${{ matrix.compiler }}
        cmake: true
        make: true


    # - name: Setup cmake
    #   uses: jwlawson/actions-setup-cmake@v2
    #   with:
    #     cmake-version: '3.28.x'
    
    # Add MinGW to PATH on Windows
    - name: Setup Windows
      if: runner.os == 'Windows'
      run: |
        echo "C:\Users\runneradmin\gcc\mingw64\bin" >> $GITHUB_PATH
        # Ensure the DLL directory is in the Path
        echo "PATH=$PATH;C:\Users\runneradmin\gcc\mingw64\bin" >> $GITHUB_ENV
      shell: bash
    
    - name: make build
      run: make build
      env:
        CMAKE_TLS_VERIFY: "0"
        CMAKE_GENERATOR: "Unix Makefiles"

    - name: make test
      run: make test/junit || make test/rerun-failed

    - name: Report test results
      uses: dorny/test-reporter@v2
      if: ${{ !cancelled() }}
      with:
        name: unit Tests
        path: junit.xml
        reporter: java-junit

    - name: ⚙️ Install lcov
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      run: |
        sudo apt-get update
        sudo apt-get -y install lcov

    - name: coverage.info
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      run: make coverage/info

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v5
      with:
        files: .coverage/coverage.info
        flags: unittests
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
