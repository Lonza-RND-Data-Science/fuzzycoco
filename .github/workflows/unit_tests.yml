name: unit tests

on:
  push:
  pull_request:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # - os:  windows-2022
          #   compiler: msvc
          - os: windows-latest
            compiler: gcc 
          # - ubuntu-latest
          # - macos

    steps:
    - uses: actions/checkout@v4
    

    # - name: Restore cache
    #   if: runner.os == 'Windows'
    #   uses: actions/cache/restore@v4
    #   with:
    #     path: |
    #       C:\Users\runneradmin\cmake
    #       C:\ProgramData\chocolatey\lib\make
    #       C:\Users\runneradmin\gcc
    #     key: ${{ runner.os }}-${{ matrix.compiler }}

    - name: Cache
      uses: actions/cache@v3
      with:
        path: |
          C:\Users\runneradmin\cmake
          C:\ProgramData\chocolatey\lib\make
          C:\Users\runneradmin\gcc
        key: ${{ runner.os }}-${{ matrix.compiler }}
        # restore-keys: |
        #   ${{ runner.os }}-${{ env.BUILD_TYPE }}

    - name: Setup Cpp
      uses: aminya/setup-cpp@v1
      with:
        compiler: ${{ matrix.compiler }}
        cmake: true
        make: true
        git: true

    # Updated Windows setup step
    - name: Setup Windows
      if: runner.os == 'Windows'
      run: |
        # Add MinGW to system PATH
        echo "C:\Users\runneradmin\gcc\mingw64\bin:C:\Users\runneradmin\gcc\mingw64\lib" >> $GITHUB_PATH
        # Add to current shell PATH
        export PATH="/c/Users/runneradmin/gcc/mingw64/bin:$PATH"
        # # Create a more comprehensive PATH update that includes lib directory
        echo "PATH=$PATH:/c/Users/runneradmin/gcc/mingw64/bin:/c/Users/runneradmin/gcc/mingw64/lib" >> $GITHUB_ENV


        echo "${{ github.workspace }}/.build/src/" >> $GITHUB_PATH

        # Verify GCC installation
        gcc --version
        # # List available DLLs (for debugging)
        # ls /c/Users/runneradmin/gcc/mingw64/bin/*.dll
      shell: bash
    
    # # explicit step to save the cache
    # - name: Save cache
    #   if: runner.os == 'Windows'
    #   uses: actions/cache/save@v4
    #   with:
    #     path: |
    #       C:\Users\runneradmin\cmake
    #       C:\ProgramData\chocolatey\lib\make
    #       C:\Users\runneradmin\gcc
    #     key: ${{ runner.os }}-${{ matrix.compiler }}


    - name: debug_build
      run: |
        echo runner.os = ${{ runner.os }}
        echo matrix.compiler = ${{ matrix.compiler }}
        if [ "$RUNNER_OS" == "Windows" ]; then
          # Print PATH for debugging
          echo "Current PATH: $PATH"
          echo GITHUB_PATH=$GITHUB_PATH
          cat $GITHUB_PATH


          # ls /c/Users/runneradmin/*
          # ls /c/ProgramData/chocolatey/bin
          type git
        fi
      shell: bash


    - name: make build
      run: | 
        cmake  -S . -B .build
        cmake --build .build/ -j 4
      env:
        CMAKE_TLS_VERIFY: "0"
        CMAKE_GENERATOR: "Unix Makefiles"
      shell: bash

    # Updated test step with error handling
    - name: make test
      run: |
        ctest --test-dir .build/tests/unit/ --output-junit junit.xml || ctest --test-dir .build/tests/unit/ --output-on-failure --rerun-failed
      env:
        GTEST_CATCH_EXCEPTIONS: "0"
      # shell: bash

    - name: Report test results
      uses: dorny/test-reporter@v2
      if: ${{ !cancelled() }}
      with:
        name: unit Tests
        path: junit.xml
        reporter: java-junit

    - name: ⚙️ Install lcov
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      run: |
        sudo apt-get update
        sudo apt-get -y install lcov

    - name: coverage.info
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      run: make coverage/info

    - name: Upload coverage to Codecov
      if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
      uses: codecov/codecov-action@v5
      with:
        files: .coverage/coverage.info
        flags: unittests
        fail_ci_if_error: true
        token: ${{ secrets.CODECOV_TOKEN }}
